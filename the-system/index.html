<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c110f">
<meta name="description" content="Personal quest tracker: nutrition, training, deep work and recovery.">
<title>The System</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="view"><div class="wrap"><div class="empty center">Loading…</div></div></main>

<nav aria-label="Main"><div class="in">
  <button data-tab="quests" class="on"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h4"/></svg>QUESTS</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M16 3c-2 2-2 6 0 8v10"/></svg>FOOD</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg>TRAIN</button>
  <button data-tab="work"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>WORK</button>
  <button data-tab="status"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"/></svg>STATUS</button>
</div></nav>

<div id="sheet" class="sheet"></div>
<div id="overlay" class="overlay"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<input type="file" id="photo-input" accept="image/*" capture="environment" hidden>
<input type="file" id="progress-input" accept="image/*" capture="user" hidden>
<input type="file" id="import-input" accept="application/json,.json" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
